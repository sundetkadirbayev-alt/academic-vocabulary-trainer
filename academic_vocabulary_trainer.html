<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Vocabulary Lab | B1–B1+</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17243c;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:970px;margin:auto;padding:26px 16px 60px}header{background:linear-gradient(120deg,#153d80,#3567ba);color:white;padding:30px;border-radius:20px}h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px)}header p{margin:0;opacity:.9}.stats{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}.pill{background:#ffffff26;border:1px solid #ffffff44;border-radius:30px;padding:8px 13px;font-size:14px}.nav{display:flex;gap:8px;overflow-x:auto;padding:16px 0}.nav button{white-space:nowrap;border:1px solid #d8e1f0;background:white;color:#2b4368;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.nav button.active{background:#2457a7;color:white}.nav button.done:after{content:' ✓';color:#18a36d}.nav button.active.done:after{color:white}.panel{background:white;border:1px solid #e0e7f1;border-radius:18px;padding:clamp(18px,3vw,32px);box-shadow:0 8px 28px #17315a0b}h2{margin:0 0 8px}.intro{color:#5e7089;margin:0 0 24px}.item{padding:16px 0;border-top:1px solid #edf0f5}.item strong{display:block;margin-bottom:9px;line-height:1.5}.options{display:grid;gap:7px}.option{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid #dbe3ee;border-radius:10px;cursor:pointer}.option:has(input:checked){background:#eef4ff;border-color:#668ed3}input[type=radio]{accent-color:#2457a7}select,input[type=text],textarea{width:100%;border:1px solid #cbd7e8;border-radius:10px;padding:11px;font:inherit;background:white;color:#17243c}textarea{min-height:75px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.primary{background:#2457a7;color:white;border:0;border-radius:11px;padding:12px 20px;font-weight:700;cursor:pointer}button.secondary{background:#eef3fa;color:#2457a7;border:0;border-radius:11px;padding:12px 20px;font-weight:700;cursor:pointer}.feedback{margin-top:12px;border-radius:10px;padding:12px;background:#f4f7fb;font-size:14px;line-height:1.55}.good{color:#087849}.bad{color:#a32929}.score{font-size:18px;font-weight:800;margin:18px 0}.wordbank{background:#f2f6fc;padding:14px;border-radius:12px;margin:0 0 12px;color:#334c70;line-height:1.8}.small{font-size:13px;color:#64758e}.footer{margin-top:16px;color:#687b96;font-size:13px}.progress{height:9px;border-radius:10px;background:#dfe8f7;margin-top:12px;overflow:hidden}.bar{height:100%;background:#79d6b0;width:0;transition:width .25s}.warning{color:#8b4e0c;background:#fff6df;border-radius:9px;padding:10px 12px;margin-top:12px}.hidden{display:none}@media(max-width:560px){header{padding:22px}.nav button{padding:10px}.panel{padding:18px}}
</style></head><body><main class="wrap"><header><h1>Academic Vocabulary Lab</h1><p>Learn the meaning. Practise in context. Use words with confidence.</p><div class="stats"><span class="pill">B1–B1+ · 29 target words</span><span class="pill" id="progressLabel">0 of 6 exercises checked</span></div><div class="progress"><div class="bar" id="bar"></div></div></header><nav class="nav" id="nav" aria-label="Exercises"></nav><section class="panel" id="panel"></section><div class="footer">Your progress is saved in this browser on this device. Written answers are self-assessed.</div></main><script>
const defs=[['analysis','a careful study of something to understand it'],['approach','a way of dealing with a problem'],['area','a particular part of a place or subject'],['assessment','a judgement about how good something is'],['assume','to accept something as true without proof'],['authority','an organisation or person with official power'],['available','ready to be used or obtained'],['benefit','a good result or advantage'],['concept','an idea, especially a general one'],['consistent','staying at the same standard or following the same pattern'],['context','the situation that helps explain something'],['contract','a legal agreement'],['create','to make something new'],['data','facts or information collected for study'],['definition','an explanation of what a word means'],['derive','to get something from a source'],['distribution','the way something is shared among people or places'],['environment','the natural world or the conditions around us'],['establish','to start an organisation or system'],['estimate','to guess an amount using available information'],['evidence','facts that show something is true'],['identify','to recognise or find something'],['income','money received from work or other sources'],['indicate','to show or suggest something'],['interpretation','an explanation of what something means'],['involve','to include something as a necessary part'],['issue','an important subject or problem'],['labor','work, especially physical work'],['legal','allowed by law']];
const exercises=[
{title:'Match the Meaning',desc:'Choose the correct definition for each word.',type:'mc',items:[
['analysis',['a careful study of something','a legal agreement','a type of payment'],0],['approach',['a person in charge','a way of dealing with something','a number based on a guess'],1],['assessment',['a judgement about quality or progress','a place to work','a written promise'],0],['authority',['a result of research','a person or organisation with official power','an example from a text'],1],['concept',['a general idea','a payment','a local government office'],0],['consistent',['always changing','following the same standard or pattern','easy to find'],1],['context',['the situation surrounding something','a type of test','an amount of money'],0],['definition',['a statement explaining a word’s meaning','a plan for a journey','a rule about salaries'],0],['interpretation',['a list of facts','an explanation of meaning','a new invention'],1],['legal',['popular with everyone','connected to a school','allowed by law'],2]]},
{title:'Choose the Word',desc:'Choose the word that best completes each sentence.',type:'mc',items:[
['The teacher asked us to focus on one ___ of the topic.',['area','contract','income'],0],['The library has several computers ___ for students to use.',['legal','available','consistent'],1],['Regular reading can ___ students in many ways.',['benefit','assume','derive'],0],['We should not ___ that everyone has internet access.',['identify','assume','establish'],1],['The company plans to ___ a new training programme.',['create','indicate','estimate'],0],['The research team collected ___ from 200 students.',['evidence','data','labor'],1],['Many workers signed a ___ before starting the job.',['definition','contract','concept'],1],['Schools should help students protect the ___.',['environment','distribution','interpretation'],0],['The charity hopes to ___ a learning centre next year.',['involve','establish','assume'],1],['This graph may ___ a change in student habits.',['indicate','derive','benefit'],0]]},
{title:'Complete the Sentence',desc:'Type one word from the word bank in each gap. Use each word once.',type:'text',bank:['derive','distribution','estimate','evidence','identify','income','involve','issue','labor'],items:[
['Scientists need strong ___ before they can support a claim.','evidence','Evidence means facts or information supporting a claim.'],['Can you ___ the main problem in this report?','identify','Identify means find or recognise.'],['The family’s monthly ___ comes mainly from their jobs.','income','Income is money received regularly.'],['The new project will ___ students from three schools.','involve','Involve means include as participants or parts.'],['Traffic is a serious ___ in many large cities.','issue','Issue means an important problem or topic.'],['We can ___ the cost before receiving the final price.','estimate','Estimate means calculate approximately.'],['The word “biology” may ___ from Greek words.','derive','Derive from means originate from a source.'],['The chart shows the ___ of food among the families.','distribution','Distribution means how something is shared.'],['Building the road required months of hard ___.','labor','Labor is work, especially physical work.']]},
{title:'Build Collocations',desc:'Choose the word that forms the most natural expression.',type:'mc',items:[
['conduct an ___',['analysis','income','environment'],0],['take a new ___',['data','approach','evidence'],1],['make an ___ of student progress',['assessment','issue','authority'],0],['local ___',['concept','authority','contract'],1],['sign a ___',['context','contract','definition'],1],['collect ___',['data','legal','benefit'],0],['provide strong ___',['evidence','area','income'],0],['monthly ___',['assessment','income','analysis'],1],['protect the ___',['distribution','environment','concept'],1],['solve an ___',['issue','approach','available'],0]]},
{title:'Complete the Mini-Dialogue',desc:'Read each short conversation and choose the word that best completes the reply.',type:'mc',items:[
['A: Do we know the exact number of visitors? B: No, but we can ___ it using last year’s data.',['estimate','establish','identify'],0],
['A: Why did you change your research plan? B: We decided to try a different ___ to the problem.',['concept','approach','definition'],1],
['A: Can I borrow a laptop today? B: Yes, two laptops are still ___.',['consistent','legal','available'],2],
['A: How do you know the medicine worked? B: The researchers found strong ___ in the test results.',['evidence','income','authority'],0],
['A: What does this symbol on the map mean? B: It may ___ where the hospital is.',['assume','indicate','derive'],1],
['A: What did the teacher say about your progress? B: Her ___ was generally positive.',['distribution','environment','assessment'],2],
['A: What is the biggest problem in our neighbourhood? B: Traffic is a serious ___ here.',['issue','benefit','context'],0],
['A: Where did you get these numbers? B: We collected the ___ in a student survey.',['definition','data','contract'],1],
['A: Who can give us official permission? B: We should contact the local ___.',['analysis','interpretation','authority'],2],
['A: Will students help organise the event? B: Yes, the project will ___ students from three classes.',['involve','estimate','assume'],0]]},
{title:'Use It Yourself',desc:'Write your own sentences. Then compare them with the model answers and assess yourself.',type:'writing',items:[
['Write one sentence using “available” about school resources.','Extra textbooks are available in the school library.'],['Write one sentence using “benefit” about learning English.','Daily reading can benefit students who are learning English.'],['Write one sentence using “assume” about research.','We should not assume the results are correct without checking the data.'],['Write one sentence using “establish” about an organisation.','The school plans to establish a new debate club.'],['Write one sentence using “estimate” about money.','We estimate that the trip will cost about $200.'],['Write one sentence using “interpretation” about a graph.','My interpretation of the graph is that sales increased steadily.'],['Write one sentence using “legal” about a rule.','The company must follow all legal requirements.'],['Write one sentence using “distribution” about resources.','The distribution of resources should be fair.']]}];
let state={tab:0,answers:{},results:{}};try{const s=JSON.parse(localStorage.getItem('academic-vocab-lab-v1'));if(s&&typeof s==='object')state={...state,...s}}catch(e){};function save(){try{localStorage.setItem('academic-vocab-lab-v1',JSON.stringify(state))}catch(e){}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function key(i,j){return i+'-'+j}function render(){const nav=document.getElementById('nav'),p=document.getElementById('panel');nav.innerHTML=exercises.map((e,i)=>`<button class="${i===state.tab?'active':''} ${state.results[i]?'done':''}" onclick="go(${i})">${i+1}. ${esc(e.title)}</button>`).join('');let done=Object.keys(state.results).length;document.getElementById('progressLabel').textContent=`${done} of 6 exercises checked`;document.getElementById('bar').style.width=(done/6*100)+'%';const e=exercises[state.tab],i=state.tab,r=state.results[i];let h=`<h2>${esc(e.title)}</h2><p class="intro">${esc(e.desc)}</p>`;if(e.bank)h+=`<div class="wordbank"><b>Word bank:</b> ${e.bank.map(esc).join(' · ')}</div>`;e.items.forEach((item,j)=>{const k=key(i,j),val=state.answers[k]??'';h+=`<div class="item"><strong>${j+1}. ${esc(item[0])}</strong>`;if(e.type==='mc')h+=`<div class="options">${item[1].map((o,n)=>`<label class="option"><input type="radio" name="q${j}" value="${n}" ${String(val)===String(n)?'checked':''} onchange="setAnswer(${i},${j},this.value)"> ${esc(o)}</label>`).join('')}</div>`;else if(e.type==='text')h+=`<input type="text" value="${esc(val)}" aria-label="Answer ${j+1}" oninput="setAnswer(${i},${j},this.value)" placeholder="Type one word" autocomplete="off">`;else h+=`<textarea aria-label="Your sentence ${j+1}" oninput="setAnswer(${i},${j},this.value)" placeholder="Write a complete sentence...">${esc(val)}</textarea>`;if(r){if(e.type==='writing')h+=`<div class="feedback"><b>Model answer:</b> ${esc(item[1])}<br><span class="small">Compare meaning, grammar and natural word use with your own sentence.</span></div>`;else{const ok=r.marks[j];const correct=e.type==='mc'?item[1][item[2]]:item[1];h+=`<div class="feedback"><b class="${ok?'good':'bad'}">${ok?'Correct':'Review this answer'}</b>${ok?'':`<br><b>Correct answer:</b> ${esc(correct)}`}${e.type==='text'?`<br>${esc(item[2])}`:''}</div>`}}h+='</div>'});if(r)h+=`<div class="score">${e.type==='writing'?'Model answers are now visible. Review your own sentences.':`Score: ${r.marks.filter(Boolean).length} / ${e.items.length}`}</div>`;h+=`<div class="actions"><button class="primary" onclick="check()">${r?'Check Again':'Check Answers'}</button><button class="secondary" onclick="resetExercise()">Try Again</button>${i<5?`<button class="secondary" onclick="go(${i+1})">Next Exercise →</button>`:''}</div>`;if(!r)h+=`<p class="small">Complete the exercise before checking. You can change answers and check again.</p>`;p.innerHTML=h}
window.go=i=>{state.tab=i;save();render();window.scrollTo({top:0,behavior:'smooth'})};window.setAnswer=(i,j,v)=>{state.answers[key(i,j)]=v;save()};window.check=()=>{const i=state.tab,e=exercises[i];const missing=e.items.some((_,j)=>!String(state.answers[key(i,j)]??'').trim());if(missing&&!confirm('Some answers are empty. Check anyway?'))return;let marks=e.items.map((item,j)=>{let a=String(state.answers[key(i,j)]??'').trim();return e.type==='mc'?a===String(item[2]):e.type==='text'?a.toLowerCase().replace(/[.!?]+$/,'')===item[1]:a.length>0});state.results[i]={marks};save();render();document.querySelector('.actions').scrollIntoView({behavior:'smooth',block:'nearest'})};window.resetExercise=()=>{const i=state.tab;exercises[i].items.forEach((_,j)=>delete state.answers[key(i,j)]);delete state.results[i];save();render()};render();
</script></body></html>
